name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # The status line is stdlib-only and platform-agnostic, so ubuntu is just
    # the cheapest runner. This needed macOS back when a daemon read the
    # Keychain; nothing here touches host state any more, which is also why
    # the CLAWDBAR_PROJECTS / CLAWDBAR_CREDENTIALS pinning is gone.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run tests
        run: uv run --with pytest pytest -q
